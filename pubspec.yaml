name: todo
description: "Offline todo app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.2+1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  uuid: ^4.6.0
  intl: ^0.20.3
  path: ^1.9.1
  google_fonts: ^6.2.1
  animations: ^2.0.11
  flutter_slidable: ^4.0.3
  pdf: 3.11.3
  printing: ^5.14.2
  share_plus: ^13.3.1
  open_filex: ^5.0.0
  flutter_local_notifications: 22.3.3
  timezone: 0.11.2
  flutter_timezone: 5.1.1
  local_auth: ^3.0.2
  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.6
  app_settings: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Inter-Regular.ttf
    - assets/fonts/Inter-SemiBold.ttf
